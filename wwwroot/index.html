<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LoveMatch</title>
<style>
:root{--black:#120D08;--black2:#1B140C;--panel:#221A10;--panel2:#2B2114;--line:rgba(255,201,60,.14);--orange:#FF7A33;--orange2:#E85A25;--yellow:#FFC93C;--cream:#FFF6E9;--muted:#C9B79C;--muted2:#8C7B62;--danger:#FF5D5D;--grad:linear-gradient(135deg,#120D08 0%,#5C2410 38%,#E85A25 70%,#FFC93C 100%);--btn:linear-gradient(120deg,#FF7A33,#FFC93C)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--grad);background-attachment:fixed;color:var(--cream);font-family:Segoe UI,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.hidden{display:none!important}button,input,textarea,select{font:inherit}.phone{width:100%;max-width:430px;height:min(870px,94vh);background:var(--black2);border:1px solid rgba(255,201,60,.18);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px -25px rgba(0,0,0,.8)}
.topbar{display:flex;gap:12px;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,122,51,.13),transparent)}.logo{width:44px;height:44px;border:0;border-radius:14px;background:var(--btn);font-weight:900;color:var(--black)}.brand{flex:1}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.me{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--yellow);font-weight:800;cursor:pointer}
main{flex:1;overflow:auto;padding:17px 15px 12px}.title{font-size:22px;margin:0 0 14px}.tabbar{display:flex;padding:8px 5px;border-top:1px solid var(--line)}.tabbar button{flex:1;border:0;background:transparent;color:var(--muted2);padding:8px 3px;border-radius:12px;font-size:11px;cursor:pointer}.tabbar button span{display:block;font-size:19px;margin-bottom:2px}.tabbar button.active{color:var(--yellow);background:rgba(255,201,60,.06)}
.deck{height:520px;position:relative}.card{position:absolute;inset:0;background:var(--panel);border:1px solid var(--line);border-radius:25px;overflow:hidden;box-shadow:0 20px 40px -18px #000}.photo{height:62%;display:flex;align-items:center;justify-content:center;font-size:86px;font-weight:800;position:relative;background:linear-gradient(155deg,#FF7A33,#FFC93C);color:rgba(0,0,0,.35)}.photo img{width:100%;height:100%;object-fit:cover}.photo:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(18,13,8,.92))}.photo-info{position:absolute;bottom:14px;left:16px;z-index:2}.photo-info h2{margin:0;font-size:25px}.photo-info small{color:var(--muted)}.body{padding:14px 16px}.body p{margin:0 0 10px;color:var(--muted);font-size:13.5px;line-height:1.5}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;border:1px solid var(--line);background:rgba(255,201,60,.1);color:#FFE29A;padding:5px 9px;border-radius:20px}.actions{display:flex;gap:10px;margin-top:13px}.btn{border:0;border-radius:15px;padding:12px 15px;font-weight:800;cursor:pointer}.btn-primary{background:var(--btn);color:var(--black)}.btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--cream)}.actions .btn{flex:1}.empty{text-align:center;color:var(--muted);padding:70px 20px}.empty b{display:block;color:var(--cream);font-size:18px;margin:8px 0}.empty .emoji{font-size:42px}
.switch{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:14px;margin-bottom:12px}.switch button{flex:1;border:0;border-radius:10px;padding:8px;background:transparent;color:var(--muted);cursor:pointer}.switch button.active{background:var(--btn);color:var(--black);font-weight:800}.row{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:17px;background:var(--panel);margin-bottom:9px;cursor:pointer}.avatar{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--btn);color:var(--black);font-weight:900;overflow:hidden;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover}.row-info{min-width:0;flex:1}.row-info b{font-size:14px}.sub{color:var(--muted2);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:10px;padding:5px 8px;border-radius:16px;background:rgba(255,201,60,.13);color:var(--yellow)}
.chat{position:absolute;inset:0;background:var(--black2);display:flex;flex-direction:column;z-index:5}.chat-head{display:flex;align-items:center;gap:9px;padding:13px;border-bottom:1px solid var(--line)}.back{background:none;border:0;color:var(--cream);font-size:22px;cursor:pointer}.messages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}.msg{max-width:78%;padding:10px 12px;border-radius:16px;font-size:13.5px;line-height:1.4}.msg.me{align-self:flex-end;background:linear-gradient(135deg,#FF7A33,#E85A25);color:var(--black);font-weight:600}.msg.them{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}.msg.system{align-self:center;background:rgba(255,201,60,.08);color:var(--muted);font-size:12px;text-align:center}.msg img,.msg video{max-width:100%;border-radius:10px;display:block}.composer{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--line);color:var(--cream);padding:10px;border-radius:13px}.icon{width:40px;border:1px solid var(--line);background:var(--panel);color:var(--yellow);border-radius:12px;cursor:pointer}.send{width:42px;border:0;background:var(--btn);border-radius:12px;cursor:pointer}
.modal-back,.auth-back,.overlay{position:fixed;inset:0;background:rgba(10,7,4,.82);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.sheet{width:100%;max-width:430px;max-height:92vh;overflow:auto;background:var(--black2);border:1px solid var(--line);border-radius:25px;padding:22px;position:relative}.sheet h2{margin:0 0 5px}.hint{font-size:12.5px;color:var(--muted);line-height:1.45}.close{position:absolute;right:15px;top:15px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--cream);cursor:pointer}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--cream);border-radius:12px;padding:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photos{display:flex;gap:8px}.slot{flex:1;aspect-ratio:3/4;border:1px dashed var(--line);background:var(--panel);border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;cursor:pointer;color:var(--muted2);font-size:23px}.slot img{width:100%;height:100%;object-fit:cover}.remove{position:absolute;top:5px;right:5px;width:23px;height:23px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff}.interest-add{display:flex;gap:7px}.interest-add input{flex:1}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:6px 9px;border-radius:18px;font-size:11px;cursor:pointer}.chip.on{color:var(--yellow);border-color:var(--yellow);background:rgba(255,201,60,.1)}.error{color:#ff8c8c;font-size:12px;margin-top:8px}.auth{max-width:390px}.auth-logo{width:64px;height:64px;border-radius:20px;background:var(--btn);display:flex;align-items:center;justify-content:center;color:var(--black);font-size:25px;font-weight:900;margin:0 auto 12px}.auth h1{text-align:center;margin:0}.auth .hint{text-align:center}.auth-tabs{display:flex;gap:6px;margin:18px 0 8px}.auth-tabs button{flex:1;border:0;border-radius:11px;padding:9px;background:var(--panel);color:var(--muted);cursor:pointer}.auth-tabs button.active{background:var(--btn);color:var(--black);font-weight:800}.full{width:100%;margin-top:8px}.logout{margin-top:12px;width:100%;background:transparent;border:1px solid rgba(255,93,93,.4);color:#ff9b9b;border-radius:13px;padding:10px;cursor:pointer}.match-card{text-align:center;max-width:320px}.match-card .hearts{font-size:52px}.match-card h2{color:#FFE29A}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:100;background:#2b2114;border:1px solid var(--line);padding:10px 14px;border-radius:12px;color:var(--cream);font-size:12px}
@media(max-width:520px){body{padding:0;min-width:0;overflow:hidden}.phone{width:100%;height:100dvh;max-width:none;border-radius:0;border:0}.sheet{width:calc(100vw - 24px);max-width:430px;border-radius:22px}.modal-back{align-items:flex-end;padding:0}.modal-back .sheet{width:100%;border-radius:22px 22px 0 0;max-height:92dvh}.auth-back{width:100vw;height:100dvh;left:0;top:0;right:0;bottom:0;padding:12px;overflow:auto}.auth-back .auth{width:min(390px,calc(100vw - 24px));max-width:390px;margin:auto;padding:18px}.auth-tabs{width:100%;display:grid;grid-template-columns:1fr 1fr}.auth-tabs button{min-width:0;width:100%;white-space:nowrap;overflow:hidden}.field input,.field textarea,.field select{max-width:100%}.full{width:100%;min-width:0}.auth-logo{flex-shrink:0}}
</style>
</head>
<body>
<div class="phone" id="appShell">
  <div class="topbar"><button class="logo">LM</button><div class="brand"><h1>LoveMatch</h1><p>Знайомства зі смаком</p></div><button class="me" id="meBtn">?</button></div>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-tab="discover" class="active"><span>◈</span>Анкети</button>
    <button data-tab="likes"><span>♡</span>Симпатії</button>
    <button data-tab="chats"><span>✉</span>Чати</button>
  </nav>
</div>
<input type="file" id="profilePhotoInput" accept="image/*" hidden>
<input type="file" id="chatMediaInput" accept="image/*,video/*" hidden>
<div class="auth-back" id="authBack">
 <div class="sheet auth"><div class="auth-logo">LM</div><h1>LoveMatch</h1><p class="hint">Створіть акаунт або увійдіть. Усі дані зберігаються у локальній SQLite базі цієї програми.</p>
  <div class="auth-tabs"><button id="loginTab" class="active">Вхід</button><button id="registerTab">Реєстрація</button></div>
  <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com"></div>
  <div class="field"><label>Пароль</label><input id="authPassword" type="password" placeholder="мінімум 8 символів"></div>
  <button class="btn btn-primary full" id="authSubmit">Увійти</button><div class="error" id="authError"></div>
 </div>
</div>
<script>
const main=document.getElementById('main');
const authBack=document.getElementById('authBack');
let token=localStorage.getItem('lovematch_token')||'';
let profileId=localStorage.getItem('lovematch_profileId')||'';
let me=null, discovery=[], matches=[], activeChat=null, pollTimer=null, likesMode='received';
let authMode='login', newPhotos=[], photoSlotIndex=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const photoUrl=p=>p?.photos?.[0]?.url||'';
const avatar=(p,size='')=>`<div class="avatar" ${size?`style="${size}"`:''}>${photoUrl(p)?`<img src="${esc(photoUrl(p))}">`:esc((p?.name||'?')[0])}</div>`;
async function api(path,opt={}){const headers={...(opt.headers||{})};if(token)headers.Authorization='Bearer '+token;if(opt.json!==undefined){headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.json)}const r=await fetch(path,{...opt,headers});if(r.status===401){logout();throw new Error('Потрібно увійти знову.')}if(!r.ok){let m='Помилка запиту';try{const j=await r.json();m=j.message||m}catch{}throw new Error(m)}if(r.status===204)return null;return await r.json()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function setAuthMode(mode){authMode=mode;$('#loginTab').classList.toggle('active',mode==='login');$('#registerTab').classList.toggle('active',mode==='register');$('#authSubmit').textContent=mode==='login'?'Увійти':'Створити акаунт';$('#authError').textContent=''}
$('#loginTab').onclick=()=>setAuthMode('login');$('#registerTab').onclick=()=>setAuthMode('register');
$('#authSubmit').onclick=async()=>{const email=$('#authEmail').value.trim(),password=$('#authPassword').value;$('#authError').textContent='';try{const a=await api('/api/auth/'+authMode,{method:'POST',json:{email,password}});token=a.token;profileId=a.profileId;localStorage.setItem('lovematch_token',token);localStorage.setItem('lovematch_profileId',profileId);authBack.classList.add('hidden');await boot();if(authMode==='register')openProfile()}catch(e){$('#authError').textContent=e.message}};
function logout(){token='';profileId='';me=null;localStorage.removeItem('lovematch_token');localStorage.removeItem('lovematch_profileId');authBack.classList.remove('hidden');main.innerHTML='';clearInterval(pollTimer)}
async function boot(){try{me=await api('/api/profiles/me');updateMe();await loadDiscovery();renderDiscover();startPolling()}catch(e){toast(e.message)}}
function updateMe(){$('#meBtn').textContent=me?.name?me.name[0].toUpperCase():'?'}
async function loadDiscovery(){discovery=await api('/api/discovery?take=30')}
function setTab(tab){document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));activeChat=null;if(tab==='discover')renderDiscover();if(tab==='likes')renderLikes();if(tab==='chats')renderChats()}
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function renderDiscover(){let h=`<h2 class="title">Анкети поруч</h2>`;if(!discovery.length){h+=`<div class="empty"><div class="emoji">🌤️</div><b>Наразі анкет для вас немає</b>Коли з'являться нові користувачі, їхні реальні анкети будуть показані тут.</div>`;main.innerHTML=h;return}const p=discovery[0];h+=`<div class="deck"><div class="card"><div class="photo">${photoUrl(p)?`<img src="${esc(photoUrl(p))}">`:esc(p.name[0])}<div class="photo-info"><h2>${esc(p.name)}, ${p.age}</h2><small>${esc(p.city||'Місто не вказано')}</small></div></div><div class="body"><p>${esc(p.bio||'Користувач поки нічого не написав про себе.')}</p><div class="tags">${(p.interests||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div></div></div><div class="actions"><button class="btn btn-ghost" id="skipBtn">Пропустити</button><button class="btn btn-primary" id="likeBtn">♡ Подобається</button></div>`;main.innerHTML=h;$('#skipBtn').onclick=()=>{discovery.shift();renderDiscover()};$('#likeBtn').onclick=()=>likeProfile(p)}
async function likeProfile(p){try{const r=await api('/api/likes/'+p.id,{method:'POST'});discovery.shift();if(r.isMutual){await loadMatches();showMatch(p,r.matchId)}else{toast('Симпатію надіслано 💛');renderDiscover()}}catch(e){toast(e.message)}}
async function renderLikes(){main.innerHTML=`<h2 class="title">Симпатії</h2><div class="switch"><button id="recBtn" class="${likesMode==='received'?'active':''}">Вам</button><button id="sentBtn" class="${likesMode==='sent'?'active':''}">Ви</button></div><div id="likesList"><div class="empty">Завантаження…</div></div>`;$('#recBtn').onclick=()=>{likesMode='received';renderLikes()};$('#sentBtn').onclick=()=>{likesMode='sent';renderLikes()};try{const data=await api('/api/likes/'+likesMode);const ms=await api('/api/matches');const box=$('#likesList');if(!data.length){box.innerHTML=`<div class="empty"><div class="emoji">♡</div><b>Поки що порожньо</b>${likesMode==='received'?'Тут будуть люди, яким ви сподобались.':'Тут будуть анкети, яким ви поставили лайк.'}</div>`;return}box.innerHTML=data.map(x=>{const p=x.profile;const m=ms.find(z=>z.otherUser.id===p.id);return `<div class="row" ${m?`data-match="${m.id}"`:''}>${avatar(p)}<div class="row-info"><b>${esc(p.name)}, ${p.age}</b><div class="sub">${esc(p.city||'')} ${m?'• є взаємний матч':''}</div></div><span class="badge">${m?'Взаємно':'♡'}</span></div>`}).join('');box.querySelectorAll('[data-match]').forEach(x=>x.onclick=()=>openChat(x.dataset.match))}catch(e){toast(e.message)}}
async function loadMatches(){matches=await api('/api/matches')}
async function renderChats(){main.innerHTML=`<h2 class="title">Чати</h2><div id="chatList"><div class="empty">Завантаження…</div></div>`;try{await loadMatches();const box=$('#chatList');if(!matches.length){box.innerHTML=`<div class="empty"><div class="emoji">✉️</div><b>Чатів ще немає</b>Після взаємної симпатії чат з'явиться автоматично.</div>`;return}const rows=[];for(const m of matches){let last='Новий матч! Напишіть перше повідомлення';try{const msgs=await api(`/api/matches/${m.id}/messages?take=1`);if(msgs.length){const z=msgs[msgs.length-1];last=z.text||(z.type===1?'📷 Фото':z.type===2?'🎬 Відео':'Повідомлення')}}catch{}rows.push(`<div class="row" data-match="${m.id}">${avatar(m.otherUser)}<div class="row-info"><b>${esc(m.otherUser.name)}</b><div class="sub">${esc(last)}</div></div><span class="badge">чат</span></div>`)}box.innerHTML=rows.join('');box.querySelectorAll('[data-match]').forEach(x=>x.onclick=()=>openChat(x.dataset.match))}catch(e){toast(e.message)}}
async function openChat(id){try{const m=matches.find(x=>x.id===id)||await api('/api/matches/'+id);activeChat=m;await api(`/api/matches/${id}/messages/read`,{method:'POST'});renderChat();if(!localStorage.getItem('lovematch_chat_tutorial'))showTutorial()}catch(e){toast(e.message)}}
async function renderChat(){if(!activeChat)return;const m=activeChat;let msgs=[];try{msgs=await api(`/api/matches/${m.id}/messages?take=100`)}catch(e){toast(e.message)}main.innerHTML=`<div class="chat"><div class="chat-head"><button class="back" id="backChat">←</button>${avatar(m.otherUser,'width:38px;height:38px;border-radius:12px')}<div><b>${esc(m.otherUser.name)}</b><div class="sub">Взаємна симпатія 💛</div></div></div><div class="messages" id="messages">${msgs.length?msgs.map(renderMessage).join(''):`<div class="msg system">Це початок вашого спілкування. Ви сподобались одне одному 💛</div>`}</div><div class="composer"><button class="icon" id="attach">📎</button><textarea id="messageText" rows="1" placeholder="Написати повідомлення..."></textarea><button class="send" id="send">➤</button></div></div>`;$('#backChat').onclick=()=>{activeChat=null;renderChats()};$('#send').onclick=sendText;$('#messageText').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}};$('#attach').onclick=()=>$('#chatMediaInput').click();const box=$('#messages');box.scrollTop=box.scrollHeight}
function renderMessage(x){const mine=x.senderProfileId===profileId;const cls=mine?'me':'them';if(x.type===1)return `<div class="msg ${cls}"><img src="${esc(x.mediaUrl)}"></div>`;if(x.type===2)return `<div class="msg ${cls}"><video src="${esc(x.mediaUrl)}" controls></video></div>`;return `<div class="msg ${cls}">${esc(x.text||'')}</div>`}
async function sendText(){const i=$('#messageText'),text=i.value.trim();if(!text||!activeChat)return;try{await api(`/api/matches/${activeChat.id}/messages`,{method:'POST',json:{text,type:0,mediaUrl:null}});i.value='';await renderChat()}catch(e){toast(e.message)}}
$('#chatMediaInput').onchange=async e=>{const f=e.target.files[0];if(!f||!activeChat)return;try{const fd=new FormData();fd.append('file',f);const up=await api(`/api/matches/${activeChat.id}/messages/media`,{method:'POST',body:fd});const type=String(up.type).toLowerCase()==='video'?2:1;await api(`/api/matches/${activeChat.id}/messages`,{method:'POST',json:{text:null,type,mediaUrl:up.url}});await renderChat()}catch(err){toast(err.message)}e.target.value=''};
function showMatch(p,id){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="sheet match-card"><div class="hearts">💛</div><h2>Взаємна симпатія!</h2><p class="hint">Ви та ${esc(p.name)} сподобались одне одному. Тепер у вас є особистий чат.</p><button class="btn btn-primary full" id="goChat">Почати спілкування</button><button class="btn btn-ghost full" id="keepLooking">Продовжити перегляд</button></div>`;document.body.appendChild(o);$('#goChat').onclick=()=>{o.remove();openChat(id)};$('#keepLooking').onclick=()=>{o.remove();renderDiscover()}}
function showTutorial(){const o=document.createElement('div');o.className='modal-back';o.innerHTML=`<div class="sheet"><button class="close">✕</button><h2>Як працює чат</h2><p class="hint">Пишіть повідомлення, додавайте фото або відео через 📎. Історія чату зберігається в SQLite і залишиться після перезапуску програми.</p><div style="font-size:70px;text-align:center;padding:25px">💬</div><button class="btn btn-primary full" id="tutorialOk">Зрозуміло</button></div>`;document.body.appendChild(o);const close=()=>{localStorage.setItem('lovematch_chat_tutorial','1');o.remove();api('/api/profiles/me/tutorial/seen',{method:'POST'}).catch(()=>{})};o.querySelector('.close').onclick=close;$('#tutorialOk').onclick=close}
$('#meBtn').onclick=()=>openProfile();
async function openProfile(){if(!me)return;newPhotos=[];const o=document.createElement('div');o.className='modal-back';o.id='profileModal';o.innerHTML=`<div class="sheet"><button class="close" id="profileClose">✕</button><h2>Ваша анкета</h2><p class="hint">Додайте до 3 фото, основні дані та інтереси. Власні інтереси можна вводити вручну.</p><div class="photos" id="photoSlots">${[0,1,2].map(i=>profileSlot(i)).join('')}</div><div class="field"><label>Ім'я</label><input id="pName" value="${esc(me.name==='Новий користувач'?'':me.name)}" placeholder="Ваше ім'я"></div><div class="grid2"><div class="field"><label>Вік</label><input id="pAge" type="number" min="18" max="100" value="${me.age||18}"></div><div class="field"><label>Місто</label><input id="pCity" value="${esc(me.city||'')}" placeholder="Вінниця"></div></div><div class="field"><label>Стать</label><select id="pGender"><option value="">Не вказано</option><option ${me.gender==='Жінка'?'selected':''}>Жінка</option><option ${me.gender==='Чоловік'?'selected':''}>Чоловік</option><option ${me.gender==='Інше'?'selected':''}>Інше</option></select></div><div class="field"><label>Про себе</label><textarea id="pBio" rows="3" placeholder="Розкажіть щось про себе">${esc(me.bio||'')}</textarea></div><label style="font-size:12px;color:var(--muted)"><input id="hideBio" type="checkbox" ${me.hideBio?'checked':''}> Не показувати опис</label><div class="field"><label>Інтереси</label><div class="interest-add"><input id="interestInput" placeholder="Наприклад: фотографія"><button class="btn btn-ghost" id="addInterest">+</button></div><div class="chips" id="chips">${(me.interests||[]).map(x=>`<button class="chip on" data-interest="${esc(x)}">${esc(x)} ✕</button>`).join('')}</div></div><button class="btn btn-primary full" id="saveProfile">Зберегти анкету</button><button class="logout" id="logoutBtn">Вийти з акаунта</button><div class="error" id="profileError"></div></div>`;document.body.appendChild(o);$('#profileClose').onclick=()=>o.remove();$('#logoutBtn').onclick=()=>{o.remove();logout()};bindPhotoSlots();$('#addInterest').onclick=e=>{e.preventDefault();addInterest()};$('#interestInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addInterest()}};$('#chips').onclick=e=>{const b=e.target.closest('[data-interest]');if(b)b.remove()};$('#saveProfile').onclick=saveProfile}
function profileSlot(i){const existing=me.photos?.[i];const staged=newPhotos[i];const src=staged?URL.createObjectURL(staged):existing?.url;return `<div class="slot" data-slot="${i}">${src?`<img src="${esc(src)}"><button class="remove" data-remove="${i}">✕</button>`:'+'}</div>`}
function bindPhotoSlots(){document.querySelectorAll('.slot').forEach(s=>s.onclick=e=>{if(e.target.dataset.remove!==undefined)return;photoSlotIndex=+s.dataset.slot;$('#profilePhotoInput').click()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const i=+b.dataset.remove;if(newPhotos[i]){newPhotos[i]=null;refreshSlots()}else if(me.photos?.[i]){try{await api('/api/profiles/me/photos/'+me.photos[i].id,{method:'DELETE'});me=await api('/api/profiles/me');refreshSlots()}catch(err){toast(err.message)}}})}
function refreshSlots(){$('#photoSlots').innerHTML=[0,1,2].map(i=>profileSlot(i)).join('');bindPhotoSlots()}
$('#profilePhotoInput').onchange=e=>{const f=e.target.files[0];if(f){newPhotos[photoSlotIndex]=f;refreshSlots()}e.target.value=''};
function addInterest(){const i=$('#interestInput'),v=i.value.trim();if(!v)return;if(![...document.querySelectorAll('[data-interest]')].some(x=>x.dataset.interest.toLowerCase()===v.toLowerCase()))$('#chips').insertAdjacentHTML('beforeend',`<button class="chip on" data-interest="${esc(v)}">${esc(v)} ✕</button>`);i.value=''}
async function saveProfile(){const err=$('#profileError');err.textContent='';const name=$('#pName').value.trim(),age=+$(`#pAge`).value,city=$('#pCity').value.trim();if(!name||age<18||!city){err.textContent='Заповніть ім’я, вік від 18 років і місто.';return}try{await api('/api/profiles/me',{method:'PUT',json:{name,age,gender:$('#pGender').value||null,city,bio:$('#pBio').value.trim()||null,hideBio:$('#hideBio').checked}});const interests=[...document.querySelectorAll('[data-interest]')].map(x=>x.dataset.interest);await api('/api/interests/me',{method:'PUT',json:interests});for(const f of newPhotos.filter(Boolean)){const fd=new FormData();fd.append('file',f);await api('/api/profiles/me/photos',{method:'POST',body:fd})}me=await api('/api/profiles/me');updateMe();document.getElementById('profileModal')?.remove();await loadDiscovery();renderDiscover();toast('Анкету збережено')}catch(e){err.textContent=e.message}}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(async()=>{if(activeChat)try{await renderChat()}catch{}},5000)}
if(token){authBack.classList.add('hidden');boot()}else authBack.classList.remove('hidden');
</script>
</body></html>
